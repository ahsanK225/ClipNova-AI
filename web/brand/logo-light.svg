<svg width="797" height="220" viewBox="0 0 797 220" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="novaTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="aiPillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.45)"/>
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0.25)"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="25" y="25" width="170" height="170" rx="42"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Neon Glow Border behind 3D Icon -->
  <rect x="23" y="23" width="174" height="174" rx="44" fill="none" stroke="#00F0FF" stroke-width="4" opacity="0.8" filter="url(#glow)"/>
  
  <!-- 3D Luxury Octane App Icon -->
  <image href="/brand/app-icon.png" x="25" y="25" width="170" height="170" preserveAspectRatio="xMidYMid slice" clip-path="url(#badgeClip)"/>
  <rect x="25" y="25" width="170" height="170" rx="42" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3"/>

  <!-- Brand Typography: ClipNova -->
  <text x="228" y="148" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="86" fill="#FFFFFF" letter-spacing="-3">Clip<tspan fill="url(#novaTextGrad)">Nova</tspan></text>

  <!-- High-Tech Neon AI Capsule Badge -->
  <g transform="translate(635, 78)">
    <rect x="0" y="0" width="136" height="74" rx="22" fill="url(#aiPillBg)" stroke="#00F0FF" stroke-width="4"/>
    <text x="68" y="52" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">AI</text>
  </g>
</svg>
